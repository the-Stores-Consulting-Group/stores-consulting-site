pageType: home
metadata:
  title: the Stores Consulting Group
  description: Retail execution consulting that closes the gap between what technology promises and what stores actually deliver.
hero:
  headline: Foundational store execution for the
  emphasis: AI era
  description: We close the gap between what the technology promises and what the store actually does — that is where your return shows up.
  primaryAction:
    label: See How We Work
    href: /approach/
  secondaryAction:
    label: Talk to Us
    href: /contact-us/
  image:
    src: /assets/editorial/Home-Page-1.jpg
    alt: A contemporary clothing store with merchandise arranged across display tables and racks.
    width: 2048
    height: 1365
    position: center
problem:
  heading: The technology is in. The store still has to run it.
  description: 'ESLs, robots, workforce systems, AI — they are already on the floor. The alert fires. The order sits. The schedule dies at 6 a.m. That is the execution gap. That is the work.'
  cards:
    - label: The Adoption Gap
      title: The alert fires. Nobody acts.
      copy: The platform did its job. No one owned the next hour. The workflow was never installed.
    - label: The Attention Gap
      title: Too much data. No framework.
      copy: The store gets more flags than it can run. So people do what they did yesterday.
    - label: The ROI Gap
      title: The promise never shows up on the floor.
      copy: The ROI was modeled in the deck. Margin is still leaking in the aisle. That is not a software miss.
ratio:
  items:
    - value: 70%
      label: Human Execution
      copy: Accountability. Workflows. Trust. The daily discipline to act on what the platform signals.
    - value: 30%
      label: The Platform
      copy: AI surfaces the problem. Humans actually solve it.
  quote: '“This is 70% a change management game, 30% a technology game.”'
proof:
  eyebrow: 'Proof, Not Promises'
  heading: We measure results the way your finance team would.
  paragraphs:
    - 'Every range we quote is pulled from actual engagement outcomes across grocery, drug, department, convenience, and specialty retail — not an industry average or a best-case scenario borrowed from somewhere else.'
    - A diagnostic determines which of these drivers actually applies to you before any number ends up in a proposal.
  action:
    label: See how we measure results →
    href: /results/
  image:
    src: 'https://stores-consulting-site-dusky.vercel.app/wp-content/uploads/2016/09/convenience.jpg'
    alt: A store associate at a checkout while a customer stands beside the counter.
    width: 2048
    height: 1407
    position: center
  outcomes:
    - label: Labor productivity
      value: 5–15%
    - label: Shrink & waste reduction
      value: 20–60%
    - label: Total store sales gains
      value: Up to 7%
    - label: Cash-handling hours cut
      value: 30–80%
  totalLabel: 'Profit created, all clients'
  totalValue: $12B+
servicesIntro:
  heading: Four aisles. One discipline.
  description: 'Turning what your data already tells you into what your stores actually do — every shift, every store, every time.'
approach:
  heading: 'Diagnose It. Prove It. Then Spread It.'
  description: 'Some stores already have the standard. Some do not. The first job is to see which is true — then install it in a store and teach the rest of the fleet. Not a fixed-hour product. Not one path for every banner.'
  action:
    label: See Our Full Approach
    href: /approach/
  steps:
    - number: '01'
      title: Diagnose the real gap
      copy: 'On the floor. What is actually broken, who owns it, whether a working standard already exists in the fleet.'
    - number: '02'
      title: Prove the standard
      copy: 'In a lighthouse store if one exists. In a model store if one does not. Leaders have to be able to run it without us.'
    - number: '03'
      title: Scale through the field
      copy: 'Transfer capability through dashboards, escalation paths, and peer mentorship.'
technology:
  eyebrow: Technology Philosophy
  heading: We work with any platform — on purpose.
  description: 'We want only the best solution for you and your business, that is why we are tech agnostic. That independence is the point: our job is making sure the investment you made pays off on the floor.'
  pills:
    - Vendor-agnostic
    - Execution-first
    - Built for adoption
    - Measured in outcomes
teamProof:
  heading: Decades inside retail. Not just around it.
  description: 'Our team has run stores, managed P&Ls, and sat where you sit. We don''t bring theory — we bring people who''ve done the job, and a methodology built from doing it again and again.'
  metrics:
    - value: 40+
      label: 'Practitioners across grocery, specialty, convenience and mass retail'
    - value: 7–10x
      label: Typical return generated relative to engagement investment
    - value: Multi
      label: 'Project engagements are the norm, not the exception, with our clients'
    - value: $12 billion
      label: in profit created and counting
